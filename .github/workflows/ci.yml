name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Build (fetches GitHub data, type-checks, pre-renders)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Keep the tested build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true # .nojekyll
          retention-days: 1

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.16.0 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Mirror of the Vercel site on https://cyrus937.github.io/
  # Publishes the exact build that passed the tests to the cyrus937/cyrus937.github.io repo.
  # Needs the GH_PAGES_DEPLOY_KEY secret (see README → "GitHub Pages").
  deploy-github-pages:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Push to cyrus937/cyrus937.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: cyrus937/cyrus937.github.io
          publish_branch: main
          publish_dir: dist
          force_orphan: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: portfolio"
